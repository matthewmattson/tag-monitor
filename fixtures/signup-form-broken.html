<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup form, conversion event removed</title>
  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PJ4VGDKV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <h1>Signup form, conversion event removed</h1>
  <p>The form still works for visitors, but the line that reports the conversion was lost in a refactor.</p>

  <form id="signup">
    <label>Name <input id="name" name="name" required /></label>
    <label>Email <input id="email" name="email" type="email" required /></label>
    <button type="submit">Join the waitlist</button>
  </form>
  <p id="thanks" hidden>Thanks, you're on the list.</p>

  <script>
    document.getElementById('signup').addEventListener('submit', async function (event) {
      event.preventDefault();
      const response = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
        }),
      });
      if (!response.ok) return;
      this.hidden = true;
      document.getElementById('thanks').hidden = false;
    });
  </script>
</body>
</html>

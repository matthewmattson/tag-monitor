<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup form</title>
  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TKSW6PBD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <h1>Signup form</h1>
  <p>Control form: a successful signup pushes generate_lead to the dataLayer, and Tag Manager forwards it to GA4.</p>

  <form id="signup">
    <label>Name <input id="name" name="name" required /></label>
    <label>Email <input id="email" name="email" type="email" required /></label>
    <button type="submit">Join the waitlist</button>
  </form>
  <p id="thanks" hidden>Thanks, you're on the list.</p>

  <script>
    document.getElementById('signup').addEventListener('submit', async function (event) {
      event.preventDefault();
      const response = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
        }),
      });
      if (!response.ok) return;
      this.hidden = true;
      document.getElementById('thanks').hidden = false;
      // Report the conversion once the signup has succeeded. Tag Manager
      // picks this up and forwards it to GA4.
      window.dataLayer.push({ event: 'generate_lead', method: 'waitlist' });
    });
  </script>
</body>
</html>

name: "Demo: broken tags"

# Runs the monitor against the deliberately broken pages in ./fixtures.
# This workflow is EXPECTED TO FAIL: the point is to show what the monitor
# reports for each kind of tagging mistake. It never opens an issue.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.read.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "playwright=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  demo:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Playwright's own image already contains the browsers and their system
    # libraries, so nothing is installed per run.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright }}-noble
      options: --user 1001
    env:
      SITE_CONFIG: examples/demo.json
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check tags on the broken demo pages
        run: npx playwright test

      - name: Upload full report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

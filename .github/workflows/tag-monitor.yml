name: Tag monitor

on:
  schedule:
    # When the monitor runs, in UTC. To change the cadence, edit this line:
    #   "0 14 * * 1"   every Monday at 14:00 UTC (current)
    #   "0 14 * * *"   every day at 14:00 UTC
    #   "0 14 1 * *"   the 1st of every month at 14:00 UTC
    - cron: "0 14 * * 1"

  # Adds a "Run workflow" button in the Actions tab for on-demand runs.
  workflow_dispatch:
    inputs:
      target:
        description: "live = the real site. demo = deliberately broken pages (expected to fail)."
        type: choice
        options:
          - live
          - demo
        default: live

permissions:
  contents: read
  issues: write

concurrency:
  group: tag-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ inputs.target || 'live' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_LABEL: tag-monitor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check tags
        run: npx playwright test

      - name: Upload full report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Failures on the live site open an issue, or add a comment to the one
      # already open, so a problem that persists doesn't create duplicates.
      - name: Open or update an issue
        if: ${{ failure() && env.TARGET == 'live' }}
        run: |
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "Opened by the tag monitor" --force
          {
            cat monitor-report.md 2>/dev/null || echo "The monitor failed before it could produce a report."
            echo
            echo "[Full run and downloadable report]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > issue.md
          open_issue=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file issue.md
          else
            gh issue create --title "Tag monitor: checks are failing on the live site" \
              --label "$ISSUE_LABEL" --body-file issue.md
          fi

      # When the live site is healthy again, close the issue with a note.
      - name: Close the issue once checks pass again
        if: ${{ success() && env.TARGET == 'live' }}
        run: |
          open_issue=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "All checks passed again in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi

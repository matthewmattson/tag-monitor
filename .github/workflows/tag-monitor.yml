name: Tag monitor

on:
  schedule:
    # When the monitor runs, in UTC. To change the cadence, edit this line:
    #   "0 14 * * 1"   every Monday at 14:00 UTC (current)
    #   "0 14 * * *"   every day at 14:00 UTC
    #   "0 * * * *"    every hour
    #   "0 14 1 * *"   the 1st of every month at 14:00 UTC
    - cron: "0 14 * * 1"

  # Adds a "Run workflow" button in the Actions tab for on-demand runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every JSON file in sites/ is one site to check.
  sites:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "configs=$(ls sites/*.json | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  monitor:
    needs: sites
    strategy:
      # One site failing shouldn't stop the others from being checked.
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.sites.outputs.configs) }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/monitor.yml
    with:
      config: ${{ matrix.config }}
      tool-ref: ${{ github.sha }}
